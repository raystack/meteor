    - main [ref=f2e215]:
      - generic [ref=f2e216]:
        - article [ref=f2e217]:
          - heading "Quickstart" [level=1] [ref=f2e218]
          - generic [ref=f2e219]:
            - paragraph [ref=f2e220]: This guide takes you from a fresh install to your first extracted metadata in a few minutes. It uses the CSV extractor and the console sink, so you need no database or external service.
            - heading "1. Install Meteor" [level=2] [ref=f2e221]
            - code [ref=f2e224]:
              - generic [ref=f2e225]: brew install raystack/tap/meteor
            - paragraph [ref=f2e226]:
              - text: See
              - link "Installation" [ref=f2e227] [cursor=pointer]:
                - /url: /docs/installation
              - text: for Docker, binary, and source options.
            - heading "2. Create a sample data file" [level=2] [ref=f2e228]
            - paragraph [ref=f2e229]: "Make a small CSV file for Meteor to read:"
            - code [ref=f2e232]:
              - generic [ref=f2e233]: echo "id,name,email" > users.csv
            - heading "3. Create a recipe" [level=2] [ref=f2e234]
            - paragraph [ref=f2e235]: "A recipe is a YAML file that tells Meteor what to extract and where to send it. Generate one with the CLI:"
            - code [ref=f2e238]:
              - generic [ref=f2e239]: meteor recipe init quickstart -n demo -e csv -s console > recipe.yaml
            - paragraph [ref=f2e240]:
              - text: This creates a recipe named
              - code [ref=f2e241]: quickstart
              - text: with the
              - code [ref=f2e242]: csv
              - text: extractor and the
              - code [ref=f2e243]: console
              - text: sink. The
              - code [ref=f2e244]: "-n demo"
              - text: flag sets the scope, which becomes part of every URN Meteor generates.
            - paragraph [ref=f2e245]:
              - text: Open
              - code [ref=f2e246]: recipe.yaml
              - text: "and set the path to your CSV file:"
            - code [ref=f2e249]:
              - generic [ref=f2e250]: "name: quickstart"
              - generic [ref=f2e251]: "version: v1beta1"
              - generic [ref=f2e252]: "source:"
              - generic [ref=f2e253]: "name: csv"
              - generic [ref=f2e254]: "scope: demo"
              - generic [ref=f2e255]: "config:"
              - generic [ref=f2e256]: "path: ./users.csv"
              - generic [ref=f2e257]: "sinks:"
              - generic [ref=f2e258]: "- name: console"
            - heading "4. Validate the recipe" [level=2] [ref=f2e259]
            - code [ref=f2e262]:
              - generic [ref=f2e263]: meteor lint recipe.yaml
            - paragraph [ref=f2e264]: Lint checks that the plugins exist and their configs are valid before you run anything.
            - heading "5. Run it" [level=2] [ref=f2e265]
            - code [ref=f2e268]:
              - generic [ref=f2e269]: meteor run recipe.yaml
            - paragraph [ref=f2e270]: "The console sink prints each record as one JSON line, and Meteor ends with a run summary:"
            - code [ref=f2e273]:
              - generic [ref=f2e274]: "{\"entity\":{\"urn\":\"urn:csv:demo:file:users.csv\",\"type\":\"table\",\"name\":\"users.csv\",\"source\":\"csv\",\"properties\":{\"columns\":[{\"name\":\"id\"},{\"name\":\"name\"},{\"name\":\"email\"}]}}}"
            - paragraph [ref=f2e275]:
              - text: Each record contains an
              - strong [ref=f2e276]: entity
              - text: (the resource and its metadata) and, for sources that support it,
              - strong [ref=f2e277]: edges
              - text: (relationships like ownership and lineage).
            - heading "Next steps" [level=2] [ref=f2e278]
            - list [ref=f2e279]:
              - listitem [ref=f2e280]:
                - text: Point Meteor at a real source. Pick one from the
                - link "extractors list" [ref=f2e281] [cursor=pointer]:
                  - /url: /docs/extractors/overview
                - text: and swap the
                - code [ref=f2e282]: source
                - text: block.
              - listitem [ref=f2e283]:
                - text: Send metadata somewhere useful. Swap the console sink for
                - link "Compass, Kafka, or another sink" [ref=f2e284] [cursor=pointer]:
                  - /url: /docs/sinks/overview
                - text: .
              - listitem [ref=f2e285]:
                - text: Learn how recipes work in the
                - link "recipe reference" [ref=f2e286] [cursor=pointer]:
                  - /url: /docs/concepts/recipe
                - text: .
              - listitem [ref=f2e287]:
                - text: Preview any recipe safely with
                - code [ref=f2e288]: meteor run recipe.yaml --dry-run --limit 10
                - text: .
